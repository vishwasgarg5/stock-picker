name: Evening evaluation and retraining

on:
  workflow_dispatch:
  schedule:
    - cron: '30 16 * * 1-5'
      timezone: 'Asia/Kolkata'

permissions:
  contents: write

concurrency:
  group: stock-picker-evening
  cancel-in-progress: false

jobs:
  evening:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run evening evaluation and retraining
        run: python jobs/evening.py

      - name: Commit generated data and models
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/ models/
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m "chore: evening evaluation and retraining $(date -u +%F)"
            git push origin HEAD:main
          fi
