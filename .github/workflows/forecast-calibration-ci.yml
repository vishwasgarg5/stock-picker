name: Forecast Calibration Regression Tests

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/forecast-calibration-ci.yml"
      - "src/phase97_forecast_quality.py"
      - "src/phase116_shrinkage_calibration.py"
      - "src/phase117_bias_correction.py"
      - "src/phase118_forecast_error_diagnosis.py"
      - "src/phase119_prospective_validation.py"
      - "tests/test_phase119_prospective_validation.py"
      - "tests/test_phase118_forecast_error_diagnosis.py"
      - "tests/test_phase97_forecast_quality.py"
      - "tests/test_phase116_shrinkage_calibration.py"
      - "tests/test_phase117_bias_correction.py"
  pull_request:
    paths:
      - "src/phase97_forecast_quality.py"
      - "src/phase116_shrinkage_calibration.py"
      - "tests/test_phase97_forecast_quality.py"
      - "tests/test_phase116_shrinkage_calibration.py"
      - "src/phase117_bias_correction.py"
      - "src/phase118_forecast_error_diagnosis.py"
      - "src/phase119_prospective_validation.py"
      - "tests/test_phase117_bias_correction.py"
      - "tests/test_phase118_forecast_error_diagnosis.py"
      - "tests/test_phase119_prospective_validation.py"

permissions:
  contents: read

jobs:
  forecast-calibration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pandas numpy pytest
      - name: Validate Python syntax
        run: python -m py_compile src/phase97_forecast_quality.py src/phase116_shrinkage_calibration.py src/phase117_bias_correction.py src/phase118_forecast_error_diagnosis.py src/phase119_prospective_validation.py tests/test_phase97_forecast_quality.py tests/test_phase116_shrinkage_calibration.py tests/test_phase117_bias_correction.py tests/test_phase118_forecast_error_diagnosis.py tests/test_phase119_prospective_validation.py
      - name: Evaluate saved forecasts with leakage-safe calibration (analysis-only)
        run: python -m src.phase116_shrinkage_calibration
      - name: Evaluate historical bias correction (analysis-only)
        run: python -m src.phase117_bias_correction
      - name: Diagnose forecast errors by symbol and market regime (analysis-only)
        run: python -m src.phase118_forecast_error_diagnosis
      - name: Track locked prospective forecast cohort (analysis-only)
        run: python -m src.phase119_prospective_validation
      - name: Run forecast calibration regression tests
        run: pytest -q tests/test_phase97_forecast_quality.py tests/test_phase116_shrinkage_calibration.py tests/test_phase117_bias_correction.py tests/test_phase118_forecast_error_diagnosis.py tests/test_phase119_prospective_validation.py
