name: Daily stock prediction and self-retraining

on:
  workflow_dispatch:
    inputs:
      reuse_stored_data:
        description: 'Reuse already-generated repository data and only refresh reports/Telegram'
        required: false
        default: false
        type: boolean
  schedule:
    # 15:15 IST = 09:45 UTC, Monday-Friday.
    - cron: '45 9 * * 1-5'

permissions:
  contents: write

concurrency:
  group: stock-picker-daily
  cancel-in-progress: false

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Validate Python source
        run: python -m compileall -q src

      - name: Run Phase 2 and directional regression tests
        run: pytest -q tests/test_phase2_optimizer.py tests/test_directional_model.py tests/test_model_governance.py tests/test_phase4_optimizer.py tests/test_pipeline_data_quality.py tests/test_news_context.py tests/test_risk_off_selection.py tests/test_sector_risk.py tests/test_pipeline_ranking.py tests/test_advanced_governance.py tests/test_phase20_accuracy.py tests/test_phase21_26.py

      - name: Preflight end-to-end integration wiring
        if: always()
        run: python -m src.integration_check --preflight

      - name: Build new-listing ML challenger
        if: inputs.reuse_stored_data != true
        run: python -m src.new_listing_model

      - name: Build and validate dedicated ranking challenger
        if: inputs.reuse_stored_data != true
        run: python -m src.ranking_model

      - name: Build and validate trade-quality challenger
        if: inputs.reuse_stored_data != true
        run: python -m src.trade_quality_model

      - name: Validate risk management and no-trade gate
        if: inputs.reuse_stored_data != true
        run: python -m src.risk_management

      - name: Build and validate directional accuracy challenger
        if: inputs.reuse_stored_data != true
        run: python -m src.directional_model

      - name: Validate confidence calibration before production filtering
        if: inputs.reuse_stored_data != true
        run: python -m src.confidence_validation

      - name: Validate selector A/B before production selection
        if: inputs.reuse_stored_data != true
        run: python -m src.selection_validation

      - name: Update universe, evaluate yesterday's prediction, retrain and predict tomorrow
        if: inputs.reuse_stored_data != true
        run: |
          python - <<'PY'
          from src.universe import update_universe
          from src.pipeline import run_evening

          update_universe()
          run_evening()
          PY

      - name: Run Phase 2 performance optimizer in shadow mode
        run: python -m src.phase2_optimizer

      - name: Build index intelligence and market regime
        run: python -m src.index_intelligence

      - name: Run Phase 4 adaptive performance optimizer
        run: python -m src.phase4_optimizer

      - name: Run Paper Trading V2 confidence-filtered benchmark with Phase 4 overlay
        run: python -m src.paper_trading_v2

      - name: Refresh Phase 2 evidence after V2 paper trading
        run: python -m src.phase2_optimizer

      - name: Refresh Phase 4 adaptive evidence after V2 paper trading
        run: python -m src.phase4_optimizer

      - name: Run connected model and strategy governance
        if: always()
        run: python -m src.model_governance

      - name: Run production system health gate
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m src.system_health

      - name: Evaluate champion vs challenger strategy
        if: success()
        run: python -m src.strategy_governor

      - name: Build strategy A/B comparison report
        run: python -m src.strategy_ab_report

      - name: Run advanced selection calibration and safety controls
        run: python -m src.advanced_governance

      - name: Run consolidated performance audit
        run: python -m src.performance_audit

      - name: Run Phase 20 accuracy recovery diagnostics (analysis-only)
        run: python -m src.phase20_accuracy

      - name: Run Phases 21-26 validation, leakage, evidence, storage and drift diagnostics (analysis-only)
        run: python -m src.phase21_26

      - name: Build detailed portfolio comparison
        run: python -m src.portfolio_comparison

      - name: Refresh performance history
        run: python -m src.performance_history

      - name: Build Phase 2 performance dashboard
        run: python -m src.phase2_dashboard

      - name: Final end-to-end integration and promotion gate
        run: python -m src.integration_check

      - name: Send tomorrow's Top-10 prediction
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FORCE_TELEGRAM: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: python -m src.telegram

      - name: Send previous session OHLC evaluation
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -c "from src.telegram import send_evening; send_evening()"

      - name: Send completed Top-5 paper trading result
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -c "from src.telegram import send_paper_trading; send_paper_trading()"

      - name: Send V2 risk-gated paper trading result
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -c "from src.telegram import send_paper_trading_v2; send_paper_trading_v2()"

      - name: Commit prediction, evaluation, model and history files
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi

          git commit -m "chore: daily predict evaluate retrain"

          # A source/config commit may land while this long-running job is executing.
          # Rebase the generated-data commit onto the latest remote branch before pushing.
          for attempt in 1 2 3; do
            if git push origin HEAD:${GITHUB_REF_NAME}; then
              exit 0
            fi
            git fetch origin ${GITHUB_REF_NAME}
            git rebase -X theirs origin/${GITHUB_REF_NAME} || {
              git rebase --abort
              echo "Unable to rebase generated data onto latest ${GITHUB_REF_NAME}."
              exit 1
            }
          done

          echo "Unable to push generated data after 3 attempts."
          exit 1
