name: Weekend Stock Picker Data Quality Audit

on:
  schedule:
    # Saturday 09:00 IST = Friday 03:30 UTC
    - cron: '30 3 * * 6'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stock-picker-daily-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Refresh official NSE market calendar
        run: python -m src.market_calendar
      - name: Refresh source-backed market history and audit all collected/model artifacts
        run: python -m src.weekend_data_quality_audit
      - name: Refresh index OHLCV and constituent intelligence
        run: python -m src.index_constituent_intelligence
      - name: Run chronological index-feature shadow validation
        run: python -m src.index_feature_validation

      - name: Commit only refreshed OHLCV and weekend audit reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/nse_market_calendar.json data/nse_market_calendar_audit.json data/ohlcv.csv data/fundamentals.csv data/fundamentals_history.csv data/weekend_data_quality_audit.json data/weekend_data_quality_audit.csv data/historical_coverage_audit.json data/historical_coverage_audit.csv data/nse_listing_master.csv data/index_ohlcv.csv data/index_constituents_history.csv data/index_constituent_features.csv data/index_constituent_intelligence_audit.json data/index_feature_validation.json
          if git diff --cached --quiet; then
            echo "No data or audit report changes to commit."
          else
            git commit -m "chore: refresh weekend data quality audit"
            git push
          fi
