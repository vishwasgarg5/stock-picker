name: Model Intelligence Dashboard

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/model-dashboard.yml"
      - "src/model_dashboard.py"
      - "dashboard/index.html"
      - "data/**"
      - "!data/dashboard_data.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: model-intelligence-dashboard
  cancel-in-progress: false

jobs:
  build-dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install dashboard dependency
        run: python -m pip install --disable-pip-version-check pandas
      - name: Build dashboard data from persisted model artifacts
        run: python -m src.model_dashboard
      - name: Commit refreshed dashboard data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/dashboard_data.json
          if git diff --cached --quiet; then
            echo 'Dashboard data is unchanged.'
            exit 0
          fi
          git commit -m "chore: refresh model intelligence dashboard"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git fetch origin main
            git rebase origin/main || {
              git rebase --abort
              echo 'Unable to rebase dashboard data onto latest main.'
              exit 1
            }
          done
          echo 'Unable to push dashboard data after 3 attempts.'
          exit 1
