      - "src/phase85_88_diagnostics.py"
      - "tests/test_phase85_88_diagnostics.py"

permissions:
  contents: read

jobs:
  pipeline-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install project and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt pytest
      - name: Validate Python syntax
        run: python -m py_compile src/phase58_62_evidence.py src/phase81_84_diagnostics.py src/phase85_88_diagnostics.py src/integration_check.py src/phase58_62_evidence.py src/phase81_84_diagnostics.py src/phase85_88_diagnostics.py src/pipeline.py src/paper_trading.py src/paper_trading_v2.py src/phase103_forecast_evidence.py src/phase107_115_evidence.py src/phase48_52_evidence.py tests/test_phase48_52_evidence.py tests/test_pipeline_data_quality.py tests/test_prediction_validation.py tests/test_corporate_action_adjustments.py tests/test_paper_trading.py tests/test_paper_trading_v2_accounting.py tests/test_phase103_forecast_evidence.py tests/test_phase107_115_evidence.py tests/test_phase48_52_evidence.py src/phase120_forecast_stability.py tests/test_phase120_forecast_stability.py src/phase119_prospective_validation.py tests/test_phase119_prospective_validation.py src/phase2_optimizer.py tests/test_phase2_optimizer.py src/ranking_model.py tests/test_pipeline_ranking.py src/phase105_exit_attribution.py tests/test_phase105_exit_attribution.py src/system_health.py tests/test_system_health.py src/weekend_data_quality_audit.py src/historical_coverage_audit.py src/historical_listing_provenance.py src/recover_historical_data.py src/repair_historical_gaps.py src/market_calendar.py src/listing_master.py src/index_constituent_intelligence.py tests/test_index_constituent_intelligence.py tests/test_index_constituent_intelligence.py tests/test_market_calendar.py tests/test_historical_coverage_audit.py tests/test_repair_historical_gaps.py src/selection_validation.py tests/test_weekend_data_quality_audit.py tests/test_historical_listing_provenance.py
      - name: Run integration wiring preflight
        run: python -m src.integration_check --preflight
      - name: Run pipeline integrity regression tests
        run: pytest -q tests/test_phase58_62_evidence.py tests/test_phase81_84_diagnostics.py tests/test_phase85_88_diagnostics.py tests/test_pipeline_data_quality.py tests/test_prediction_validation.py tests/test_corporate_action_adjustments.py tests/test_paper_trading.py tests/test_paper_trading_v2_accounting.py tests/test_phase107_115_evidence.py tests/test_phase120_forecast_stability.py tests/test_phase119_prospective_validation.py tests/test_phase2_optimizer.py tests/test_pipeline_ranking.py tests/test_phase105_exit_attribution.py tests/test_system_health.py tests/test_weekend_data_quality_audit.py tests/test_historical_coverage_audit.py tests/test_repair_historical_gaps.py tests/test_market_calendar.py tests/test_index_feature_validation.py tests/test_historical_listing_provenance.py
