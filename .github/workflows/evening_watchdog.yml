name: Evening workflow watchdog

on:
  workflow_dispatch:
  schedule:
    # 16:00 IST = 10:30 UTC on weekdays.
    - cron: '30 10 * * 1-5'

permissions:
  contents: read
  actions: write

jobs:
  watchdog:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check evening completion
        id: check
        shell: bash
        run: |
          TODAY_UTC="$(date -u +%F)"
          if [ -f data/evening_last_success.txt ] && grep -q "^${TODAY_UTC}T" data/evening_last_success.txt; then
            echo "completed=true" >> "$GITHUB_OUTPUT"
          else
            echo "completed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check for an active evening workflow
        id: active
        if: steps.check.outputs.completed == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          active_count="$(gh run list --workflow evening.yml --status in_progress --json databaseId --jq 'length')"
          queued_count="$(gh run list --workflow evening.yml --status queued --json databaseId --jq 'length')"
          echo "active=$active_count"
          echo "queued=$queued_count"
          if [ "$active_count" -gt 0 ] || [ "$queued_count" -gt 0 ]; then
            echo "already_running=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_running=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Dispatch evening workflow if missing
        if: steps.check.outputs.completed == 'false' && steps.active.outputs.already_running == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run evening.yml --ref main

      - name: Report watchdog result
        run: |
          if [ "${{ steps.check.outputs.completed }}" = "true" ]; then
            echo "Evening workflow already completed for today."
          elif [ "${{ steps.active.outputs.already_running }}" = "true" ]; then
            echo "Evening workflow is already queued or running; no duplicate dispatch."
          else
            echo "Evening workflow was not recorded; a replacement run was dispatched."
          fi
