name: Pipeline Data Integrity Tests

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pipeline-integrity-ci.yml"
      - ".github/workflows/daily.yml"
      - "src/pipeline.py"
      - "src/paper_trading.py"
      - "src/paper_trading_v2.py"
      - "tests/test_paper_trading.py"
      - "tests/test_paper_trading_v2_accounting.py"
      - "src/phase103_forecast_evidence.py"
      - "tests/test_phase103_forecast_evidence.py"
      - "src/phase107_115_evidence.py"
      - "tests/test_phase107_115_evidence.py"
      - "tests/test_pipeline_data_quality.py"
      - "tests/test_prediction_validation.py"
      - "tests/test_corporate_action_adjustments.py"

permissions:
  contents: read

jobs:
  pipeline-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install project and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt pytest
      - name: Validate Python syntax
        run: python -m py_compile src/pipeline.py src/paper_trading.py src/paper_trading_v2.py src/phase103_forecast_evidence.py src/phase107_115_evidence.py tests/test_pipeline_data_quality.py tests/test_prediction_validation.py tests/test_corporate_action_adjustments.py tests/test_paper_trading.py tests/test_paper_trading_v2_accounting.py tests/test_phase103_forecast_evidence.py tests/test_phase107_115_evidence.py
      - name: Run pipeline integrity regression tests
        run: pytest -q tests/test_pipeline_data_quality.py tests/test_prediction_validation.py tests/test_corporate_action_adjustments.py tests/test_paper_trading.py tests/test_paper_trading_v2_accounting.py tests/test_phase107_115_evidence.py
