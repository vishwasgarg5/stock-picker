name: Research Labels CI

on:
  push:
    branches: [main]
    paths:
      - "src/research_labels.py"
      - "tests/test_research_labels.py"
      - ".github/workflows/research-labels-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/research_labels.py"
      - "tests/test_research_labels.py"
      - ".github/workflows/research-labels-ci.yml"

permissions:
  contents: read

concurrency:
  group: research-labels-\${{ github.ref }}
  cancel-in-progress: false

jobs:
  research-label-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install numpy pandas pytest
      - name: Run isolated research label tests
        run: python -m pytest -q tests/test_research_labels.py
