name: Validate Python code

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'jobs/**'
      - 'requirements.txt'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'src/**'
      - 'jobs/**'
      - 'requirements.txt'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Compile Python modules
        run: python -m compileall -q src jobs
