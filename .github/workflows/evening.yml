name: Evening evaluation and retraining

on:
  workflow_dispatch:
  schedule:
    # 16:30 IST = 11:00 UTC on weekdays.
    - cron: '0 11 * * 1-5'

permissions:
  contents: write

concurrency:
  group: stock-picker-evening
  cancel-in-progress: false

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  evening:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run evening evaluation and retraining
        run: python jobs/evening.py

      - name: Run walk-forward validation
        run: python jobs/walk_forward.py

      - name: Update 3M 6M 9M 12M prediction outcomes
        run: python jobs/outcomes.py

      - name: Validate prediction confidence
        run: python jobs/confidence.py

      - name: Send evening accuracy report to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python jobs/evening_telegram.py

      - name: Commit generated data and models
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/ models/
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m "chore: evening evaluation and retraining $(date -u +%F)"
            git push origin HEAD:main
          fi
