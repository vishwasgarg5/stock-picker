name: Phase 129 Ranking Utility Audit

on:
  push:
    branches: [main]
    paths:
      - "src/phase129_ranking_utility_audit.py"
      - "tests/test_phase129_ranking_utility_audit.py"
      - ".github/workflows/phase129-ranking-utility-ci.yml"
      - "data/prediction_candidates_history.csv"
      - "data/ohlcv.csv"

permissions:
  contents: read

jobs:
  phase129-ranking-utility:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt pytest
      - name: Validate Phase 129 syntax
        run: python -m py_compile src/phase129_ranking_utility_audit.py tests/test_phase129_ranking_utility_audit.py
      - name: Run Phase 129 ranking utility audit (diagnostic only)
        run: python -m src.phase129_ranking_utility_audit
      - name: Run Phase 129 regression tests
        run: pytest -q tests/test_phase129_ranking_utility_audit.py
      - name: Preserve Phase 129 evidence reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase129-ranking-utility-${{ github.sha }}
          path: |
            data/phase129_ranking_utility_summary.json
            data/phase129_ranking_utility_by_session.csv
          if-no-files-found: warn
          retention-days: 90
