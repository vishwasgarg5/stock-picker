name: Daily stock prediction and self-retraining

on:
  workflow_dispatch:
  schedule:
    # 15:15 IST = 09:45 UTC, Monday-Friday.
    - cron: '45 9 * * 1-5'

permissions:
  contents: write

concurrency:
  group: stock-picker-daily
  cancel-in-progress: false

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  daily:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Python source
        run: python -m compileall -q src

      - name: Update universe, evaluate yesterday's prediction, retrain and predict tomorrow
        run: |
          python - <<'PY'
          from src.universe import update_universe
          from src.pipeline import run_evening

          update_universe()
          run_evening()
          PY

      - name: Send tomorrow's Top-10 prediction
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m src.telegram

      - name: Send previous session OHLC evaluation
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -c "from src.telegram import send_evening; send_evening()"
      - name: Send completed Top-5 paper trading result
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -c "from src.telegram import send_paper_trading; send_paper_trading()"

      - name: Commit prediction, evaluation, model and history files
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/ models/
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
          else
            git commit -m "chore: daily predict evaluate retrain"
            git push origin HEAD:main
          fi
