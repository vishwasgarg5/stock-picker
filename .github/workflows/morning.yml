name: Morning stock prediction

on:
  workflow_dispatch:
  schedule:
    # 04:00 IST = 22:30 UTC on weekdays.
    - cron: '30 22 * * 1-5'

permissions:
  contents: write

concurrency:
  group: stock-picker-morning
  cancel-in-progress: false

jobs:
  morning:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run morning pipeline
        run: python jobs/morning.py

      - name: Commit generated data and models
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/ models/
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m "chore: morning stock predictions $(date -u +%F)"
            git push origin HEAD:main
          fi
