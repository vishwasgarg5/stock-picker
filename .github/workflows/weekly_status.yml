name: Weekly model status

on:
  workflow_dispatch:
  schedule:
    # 18:00 IST = 12:30 UTC on Sunday.
    - cron: '30 12 * * 0'

permissions:
  contents: write

concurrency:
  group: stock-picker-weekly-status
  cancel-in-progress: false

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  weekly-status:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Generate and send weekly model status
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FORCE_TELEGRAM: ${{ github.event_name == 'workflow_dispatch' }}
        run: python jobs/weekly_status.py

      - name: Commit weekly delivery record
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/telegram_weekly_sent.csv
          if git diff --cached --quiet; then
            echo 'No weekly delivery record changes.'
          else
            git commit -m "chore: weekly model status"
            git push origin HEAD:main
          fi
