name: Phase 27 diagnostics regression tests

on:
  push:
    branches: [main]
    paths:
      - "src/phase27_data_quality.py"
      - "tests/test_phase27_data_quality.py"
      - ".github/workflows/phase27-diagnostics-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-phase27:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Compile diagnostic module
        run: python -m py_compile src/phase27_data_quality.py
      - name: Run Phase 27 regression tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest -q tests/test_phase27_data_quality.py
