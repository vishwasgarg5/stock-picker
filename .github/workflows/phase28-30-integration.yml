name: Phase 28-30 Integrated Diagnostics

on:
  push:
    branches:
      - phase28-30-data-quality-accuracy
    paths:
      - "src/phase21_26.py"
      - "src/phase31_walk_forward.py"
      - "tests/test_phase21_26.py"
      - ".github/workflows/phase28-30-integration.yml"
  pull_request:
    paths:
      - "src/phase21_26.py"
      - "src/phase27_data_quality.py"
      - "src/phase28_30_foundation.py"
      - "src/phase31_walk_forward.py"
      - "src/integration_check.py"
      - "tests/test_phase21_26.py"
      - "tests/test_phase27_data_quality.py"
      - "tests/test_phase28_30_foundation.py"
      - ".github/workflows/phase28-30-integration.yml"
  workflow_dispatch:
    inputs:
      test_branch:
        description: "Branch containing the diagnostics implementation to test"
        required: true
        type: choice
        default: phase28-30-data-quality-accuracy
        options:
          - phase28-30-data-quality-accuracy
          - main

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  integrated-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.test_branch || github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Compile source
        run: python -m compileall -q src

      - name: Run Phase 27 and Phase 28-30 regression tests
        run: pytest -q tests/test_phase21_26.py tests/test_phase27_data_quality.py tests/test_phase28_30_foundation.py

      - name: Check integration wiring (preflight only)
        run: python -m src.integration_check --preflight

      - name: Run Phases 21-26 evidence and drift diagnostics
        run: python -m src.phase21_26

      - name: Run Phase 27 data integrity diagnostics
        run: python -m src.phase27_data_quality

      - name: Run Phases 28-30 data quality and accuracy diagnostics
        run: python -m src.phase28_30_foundation

      - name: Run Phase 31 chronological V1/V2 evidence replay
        if: hashFiles('src/phase31_walk_forward.py') != ''
        run: python -m src.phase31_walk_forward

      - name: Verify diagnostic output and production safety guardrails
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("data/phase28_30_summary.json")
          if not p.exists():
              raise SystemExit("Phase 28-30 summary was not generated")
          payload = json.loads(p.read_text(encoding="utf-8"))
          assert payload.get("phases") == [28, 29, 30], payload
          assert payload.get("production_model_changed") is False, payload
          assert payload.get("ranking_or_risk_changed") is False, payload
          assert payload.get("v2_promoted") is False, payload
          for name in ("phase28_data_quality.csv", "phase29_dataset_audit.csv", "phase30_accuracy_metrics.csv"):
              if not Path("data", name).exists():
                  raise SystemExit(f"Expected report not generated: {name}")
          phase31_source = Path("src/phase31_walk_forward.py")
          if phase31_source.exists():
              for name in ("phase31_chronological_comparison.csv", "phase31_summary.json"):
                  if not Path("data", name).exists():
                      raise SystemExit(f"Expected Phase 31 report not generated: {name}")
              phase31 = json.loads(Path("data/phase31_summary.json").read_text(encoding="utf-8"))
              assert phase31.get("production_model_changed") is False, phase31
              assert phase31.get("ranking_or_risk_changed") is False, phase31
              assert phase31.get("v2_promoted") is False, phase31
              print("Phase 31 evidence gate:", phase31.get("evidence_gate"),
                    "| matched sessions:", phase31.get("matched_sessions"),
                    "| V2 executed trades:", phase31.get("v2_executed_trades"))
          print("Integrated reports exist; production model, ranking/risk, and V2 promotion unchanged.")
          print(json.dumps({k: payload.get(k) for k in (
              "evaluation_rows", "candidate_rows", "quality_checks",
              "quality_warnings_or_blocks", "datasets_needing_review",
              "accuracy_metric_rows"
          )}, indent=2))
          PY

      - name: Upload diagnostic reports for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase28-30-integrated-diagnostic-reports
          path: |
            data/phase21_26_summary.json
            data/phase22_leakage_audit.csv
            data/phase23_matched_evidence.csv
            data/phase25_drift_monitor.csv
            data/phase26_news_impact.csv
            data/phase27_data_quality.csv
            data/phase28_data_quality.csv
            data/phase29_dataset_audit.csv
            data/phase30_accuracy_metrics.csv
            data/phase31_chronological_comparison.csv
            data/phase31_summary.json
            data/phase28_30_summary.json
          if-no-files-found: warn
          retention-days: 14
