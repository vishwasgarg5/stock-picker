name: Phase 128 Ranking Authority Audit

on:
  push:
    branches: [main]
    paths:
      - "src/phase128_ranking_authority_audit.py"
      - "tests/test_phase128_ranking_authority_audit.py"
      - ".github/workflows/phase128-ranking-authority-ci.yml"

permissions:
  contents: read

jobs:
  phase128-ranking-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt pytest
      - name: Validate Phase 128 syntax
        run: python -m py_compile src/phase128_ranking_authority_audit.py tests/test_phase128_ranking_authority_audit.py
      - name: Run Phase 128 authority audit
        run: python -m src.phase128_ranking_authority_audit
      - name: Run Phase 128 regression tests
        run: pytest -q tests/test_phase128_ranking_authority_audit.py

      - name: Preserve Phase 128 authority decision
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase128-ranking-authority-${{ github.sha }}
          path: data/phase128_ranking_authority_audit.json
          if-no-files-found: warn
          retention-days: 90
