name: Walk-forward evaluation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/walk_forward.py'
      - 'jobs/walk_forward.py'
      - '.github/workflows/walk_forward.yml'
      - 'data/ohlcv.csv'

permissions:
  contents: write

jobs:
  walk-forward:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run walk-forward evaluation
        env:
          PYTHONPATH: .
        run: python jobs/walk_forward.py

      - name: Commit evaluation results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/walk_forward_evaluations.csv data/walk_forward_summary.csv
          if git diff --cached --quiet; then
            echo "No evaluation changes to commit"
          else
            git commit -m "Update walk-forward evaluation results"
            git push
          fi
