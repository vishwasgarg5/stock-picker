name: Morning stock prediction

on:
  workflow_dispatch:
  schedule:
    # 04:00 IST = 22:30 UTC on Mon-Fri.
    - cron: '30 22 * * 0-4'

permissions:
  contents: write

concurrency:
  group: stock-picker-morning
  cancel-in-progress: false

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  morning:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run morning pipeline
        run: python jobs/morning.py

      - name: Send predictions to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FORCE_TELEGRAM: ${{ github.event_name == 'workflow_dispatch' }}
        run: python -m src.telegram

      - name: Commit generated data and models
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/ models/
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m "chore: morning stock predictions $(date -u +%F)"
            git push origin HEAD:main
          fi
