name: Index Telegram regression tests

on:
  push:
    branches: [main]
    paths:
      - "src/telegram.py"
      - "src/index_intelligence.py"
      - "tests/test_telegram_index_summary.py"
      - ".github/workflows/index-telegram-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-index-telegram:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Compile changed modules
        run: python -m py_compile src/telegram.py src/index_intelligence.py
      - name: Run index Telegram regression tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest -q tests/test_telegram_index_summary.py
